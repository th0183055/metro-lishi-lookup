  function adminList(title,items,kind){const removeText=kind==='queue'?'Remove from queue':kind==='confirmed'?'Remove confirmation':kind==='entry'?'Remove entry flag':'Remove flag';return `<div class="admin-section"><div class="screen-title">${title}</div>${items.length?`<div class="matches">${items.map((x,i)=>`<div class="match"><div class="statusline"><span class="badge ${confidenceClass(x)}">${x.verified}</span></div><strong>${x.tool}</strong><div>${x.vehicle}</div><div class="tiny">Keyway: ${x.keyway} · ${x.used}</div><div class="actions"><button type="button" class="btn secondary" data-admin-view="${kind}:${i}">View details</button><button type="button" class="btn secondary" data-admin-remove="${kind}:${i}">${removeText}</button></div></div>`).join('')}</div>`:'<div class="warn"><strong>Nothing here yet.</strong></div>'}</div>`;}
  function renderAdminReview(){const queued=[...verifyQueue].map(findRecordById).filter(Boolean);const confirmed=[...shopConfirmed].map(findRecordById).filter(Boolean);const flagged=[...userFlags].map(findRecordById).filter(Boolean);const entryNeeded=[...entryFlags].map(findRecordById).filter(Boolean);const metroExact=metroYmm.map(metroRecordToDb);const inventoryItems=Object.entries(inventoryStatus).map(([id,status])=>({id,status,record:findRecordById(id),details:inventoryDetails[id]||{}})).filter(x=>x.record);const inStock=inventoryItems.filter(x=>x.status==='yes');const orderItems=inventoryItems.filter(x=>x.status==='order');const r=root.querySelector('#result');r.innerHTML=`<div class="statusline"><span class="badge exact">Owner only</span><span class="badge catalog">Admin review</span></div><div class="admin-grid"><div class="admin-stat"><strong>${flagged.length}</strong><span class="tiny">Public flags</span></div><div class="admin-stat"><strong>${entryNeeded.length}</strong><span class="tiny">Entry notes</span></div><div class="admin-stat"><strong>${queued.length}</strong><span class="tiny">Verify queue</span></div><div class="admin-stat"><strong>${confirmed.length}</strong><span class="tiny">Shop confirmed</span></div></div><div class="ok"><strong>Database health</strong><div class="tiny">${ymmRecords.length} built-in exact YMM records · ${metroExact.length} Metro-confirmed exact YMM records · ${vehicleRecords.filter(x=>confidenceRank(x)===2).length} split/overlap records · ${toolCatalog.length} catalog tools</div></div><div class="admin-grid"><div class="admin-stat"><strong>${inStock.length}</strong><span class="tiny">Tools in shop</span></div><div class="admin-stat"><strong>${orderItems.length}</strong><span class="tiny">Need to order</span></div></div>${orderItems.length?'<div class="admin-section"><div class="screen-title">Order List</div><div class="matches">'+orderItems.map(x=>'<div class="match"><strong>'+x.record.tool+'</strong><div>'+x.record.keyway+' · '+x.record.vehicle+'</div><div class="tiny">'+(x.details.orderNote||'No order note yet')+'</div><button type="button" class="btn secondary" data-inv-view="'+x.id.replace(/"/g,'&quot;')+'">View details</button></div>').join('')+'</div></div>':''}${inStock.length?'<div class="admin-section"><div class="screen-title">Shop Inventory</div><div class="matches">'+inStock.map(x=>'<div class="match"><strong>'+x.record.tool+'</strong><div>Qty: '+(Number(x.details.qty)||1)+(x.details.location?' · '+x.details.location:'')+(x.details.version?' · '+x.details.version:'')+'</div><div class="tiny">'+x.record.keyway+' · '+x.record.vehicle+'</div><button type="button" class="btn secondary" data-inv-view="'+x.id.replace(/"/g,'&quot;')+'">View details</button></div>').join('')+'</div></div>':''}<div class="warn"><strong>Shop data is stored in this browser.</strong><div class="tiny">Use Backup shop data before moving computers, clearing browser data, or sharing Metro-confirmed records with another shop device.</div></div>${metroExact.length?'<div class="admin-section"><div class="screen-title">Metro Exact YMM</div><div class="matches">'+metroExact.map((x,i)=>'<div class="match"><span class="badge exact">Metro confirmed</span><strong>'+x.yearMin+' '+x.make+' '+x.models[0]+'</strong><div>'+x.tool+' · '+x.keyway+'</div><div class="tiny">'+x.examples+'</div><div class="actions"><button type="button" class="btn secondary" data-metro-view="'+i+'">View details</button><button type="button" class="btn secondary" data-metro-remove="'+i+'">Remove</button></div></div>').join('')+'</div></div>':''}${adminList('Public Flags',flagged,'flagged')}${adminList('Entry Notes Needed',entryNeeded,'entry')}${adminList('Verify Queue',queued,'queue')}${adminList('Shop Confirmed',confirmed,'confirmed')}`;r.className='result show';showResult();r.querySelectorAll('[data-inv-view]').forEach(b=>b.addEventListener('click',()=>{const x=findRecordById(b.dataset.invView);if(x)renderOne(x);}));r.querySelectorAll('[data-metro-view]').forEach(b=>b.addEventListener('click',()=>renderOne(metroExact[Number(b.dataset.metroView)])));r.querySelectorAll('[data-metro-remove]').forEach(b=>b.addEventListener('click',()=>{metroYmm.splice(Number(b.dataset.metroRemove),1);saveMetroYmm();renderAdminReview();}));r.querySelectorAll('[data-admin-view]').forEach(b=>b.addEventListener('click',()=>{const [kind,i]=b.dataset.adminView.split(':'),list=kind==='queue'?queued:kind==='confirmed'?confirmed:kind==='entry'?entryNeeded:flagged;renderOne(list[Number(i)]);}));r.querySelectorAll('[data-admin-remove]').forEach(b=>b.addEventListener('click',()=>{const [kind,i]=b.dataset.adminRemove.split(':'),list=kind==='queue'?queued:kind==='confirmed'?confirmed:kind==='entry'?entryNeeded:flagged,id=recordId(list[Number(i)]);if(kind==='queue'){verifyQueue.delete(id);saveVerifyQueue();}else if(kind==='confirmed'){shopConfirmed.delete(id);saveShopConfirmed();}else if(kind==='entry'){entryFlags.delete(id);saveEntryFlags();}else{userFlags.delete(id);saveUserFlags();}renderAdminReview();}));}
  root.querySelector('#searchBtn').addEventListener('click',search);root.querySelector('#backBtn').addEventListener('click',resetResult);root.querySelector('#printBtn').addEventListener('click',()=>window.print());root.querySelector('#copyBtn').addEventListener('click',async()=>{const b=root.querySelector('#copyBtn'),text=root.querySelector('#result').innerText.trim();if(!text)return;try{await navigator.clipboard.writeText(text);b.textContent='Copied';setTimeout(()=>b.textContent='Copy result',1200);}catch(e){b.textContent='Copy failed';setTimeout(()=>b.textContent='Copy result',1200);}});root.querySelectorAll('#lishi,#keyway,#quickSearch').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')search();}));wireSuggestions('#lishi','#suggest-lishi','lishi');wireSuggestions('#keyway','#suggest-keyway','keyway');wireSuggestions('#quickSearch','#suggest-quick','quick');root.querySelectorAll('[data-common]').forEach(b=>b.addEventListener('click',()=>{resultOrigin='quick';const q=b.dataset.common,list=quickMatches(q);remember(q,list.length,{mode:'quick',q});renderMany(list);}));root.querySelector('#clearBtn').addEventListener('click',()=>{root.querySelectorAll('input').forEach(i=>i.value='');resetResult();});root.querySelector('#recentBtn').addEventListener('click',renderRecent);if(ownerMode){
    root.querySelector('#lookupScreen .actions').insertAdjacentHTML('beforeend','<button class="btn secondary" id="adminReviewBtn" type="button">Admin review</button><button class="btn secondary" id="backupBtn" type="button">Backup shop data</button><button class="btn secondary" id="restoreBtn" type="button">Restore shop data</button><button class="btn secondary" id="csvBtn" type="button">Export YMM CSV</button><input id="restoreFile" type="file" accept="application/json,.json" hidden>');
    root.querySelector('#adminReviewBtn').addEventListener('click',renderAdminReview);
    root.querySelector('#csvBtn').addEventListener('click',()=>{const rows=[['yearMin','yearMax','make','models','tool','keyway','verified','vehicle'],...applicationRecords().filter(x=>!x.catalogOnly).map(x=>[x.yearMin,x.yearMax,x.make,(x.models||[]).join(' / '),x.tool,x.keyway,x.verified,x.vehicle])];const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const blob=new Blob([rows.map(r=>r.map(esc).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='metro-lishi-ymm-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});
    root.querySelector('#backupBtn').addEventListener('click',()=>{const payload={app:'Metro Lishi Lookup',version:1,exportedAt:new Date().toISOString(),metroYmm,shopNotes,inventoryStatus,inventoryDetails,shopConfirmed:[...shopConfirmed],verifyQueue:[...verifyQueue],userFlags:[...userFlags],entryFlags:[...entryFlags],recent};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='metro-lishi-shop-data-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});
    const restoreFile=root.querySelector('#restoreFile');root.querySelector('#restoreBtn').addEventListener('click',()=>restoreFile.click());
    restoreFile.addEventListener('change',async()=>{const file=restoreFile.files&&restoreFile.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=='Metro Lishi Lookup'||Number(d.version)!==1)throw new Error('Not a Metro Lishi backup');if(!confirm('Restore this Metro Lishi shop-data backup? This will replace the shop data saved in this browser.'))return;metroYmm=Array.isArray(d.metroYmm)?d.metroYmm:[];recent=Array.isArray(d.recent)?d.recent:[];for(const k of Object.keys(shopNotes))delete shopNotes[k];Object.assign(shopNotes,d.shopNotes&&typeof d.shopNotes==='object'?d.shopNotes:{});for(const k of Object.keys(inventoryStatus))delete inventoryStatus[k];Object.assign(inventoryStatus,d.inventoryStatus&&typeof d.inventoryStatus==='object'?d.inventoryStatus:{});for(const k of Object.keys(inventoryDetails))delete inventoryDetails[k];Object.assign(inventoryDetails,d.inventoryDetails&&typeof d.inventoryDetails==='object'?d.inventoryDetails:{});shopConfirmed.clear();(d.shopConfirmed||[]).forEach(v=>shopConfirmed.add(v));verifyQueue.clear();(d.verifyQueue||[]).forEach(v=>verifyQueue.add(v));userFlags.clear();(d.userFlags||[]).forEach(v=>userFlags.add(v));entryFlags.clear();(d.entryFlags||[]).forEach(v=>entryFlags.add(v));saveMetroYmm();saveRecent();saveShopNotes();saveInventory();saveShopConfirmed();saveVerifyQueue();saveUserFlags();saveEntryFlags();alert('Shop data restored.');renderAdminReview();}catch(e){alert('Could not restore backup: '+e.message);}finally{restoreFile.value='';}});
  }
  const demoMap={fo38:'FO38',hu100r:'HU100R V3',nsn14:'NSN14 DR/BT'};root.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>renderOne(db.find(x=>x.tool===demoMap[b.dataset.demo]))));
  })();
  </script>
