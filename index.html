<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111317">
  <title>Metro Lishi Lookup</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #15171a;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
      align-items: end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    p {
      margin: 0;
      color: #5d626a;
    }

    .panel {
      background: white;
      border: 1px solid #dfe3e8;
      border-radius: 16px;
      padding: 18px;
    }

    .count {
      font-size: 26px;
      font-weight: 900;
    }

    .tiny {
      font-size: 12px;
      color: #69707a;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    button {
      font: inherit;
    }

    .tab {
      border: 1px solid #ccd2d9;
      background: transparent;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .tab.active {
      background: #1e293b;
      color: white;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #555b63;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cfd5dc;
      background: white;
      font-size: 16px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: #1e293b;
      color: white;
      cursor: pointer;
      font-weight: 800;
    }

    .btn.secondary {
      background: white;
      color: #15171a;
      border: 1px solid #cfd5dc;
    }

    .result {
      display: none;
      margin-top: 18px;
    }

    .result.show {
      display: block;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e7eef7;
      font-size: 12px;
      font-weight: 800;
      margin: 0 6px 6px 0;
    }

    .tool {
      font-size: 36px;
      font-weight: 900;
      margin: 8px 0 2px;
    }

    .vehicle-line {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .fact {
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
    }

    .fact strong {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
      text-transform: uppercase;
      color: #68707a;
    }

    .warning {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #fff7dd;
      border: 1px solid #f1d683;
    }

    .success {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #eaf6ee;
      border: 1px solid #b8ddc4;
    }

    .matches {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .match {
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      padding: 14px;
    }

    .match button {
      margin-top: 10px;
    }

    .quick-tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .quick-tools button {
      text-align: left;
      background: white;
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
    }

    .quick-tools strong {
      display: block;
      margin-bottom: 4px;
    }

    @media (max-width: 700px) {
      .hero,
      .grid3,
      .facts,
      .quick-tools {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="hero">
    <div>
      <h1>Metro Lishi Lookup</h1>
      <p>Search by vehicle, Lishi tool, or keyway.</p>
    </div>

    <div class="panel">
      <div class="tiny">Lishi catalog</div>
      <div class="count" id="toolCount">0</div>
      <strong>tools indexed</strong>
      <div class="tiny" style="margin-top:6px">
        Metro Locksmith internal reference
      </div>
    </div>
  </div>


  <div class="panel">

    <div class="tabs">
      <button class="tab active" data-mode="ymm">Year / Make / Model</button>
      <button class="tab" data-mode="lishi">Lishi Tool</button>
      <button class="tab" data-mode="keyway">Keyway / Blank</button>
      <button class="tab" data-mode="quick">Quick Search</button>
    </div>


    <div id="mode-ymm">

      <div class="grid3">

        <div>
          <label for="year">Year</label>
          <select id="year"></select>
        </div>

        <div>
          <label for="make">Make</label>
          <select id="make"></select>
        </div>

        <div>
          <label for="model">Model</label>
          <select id="model"></select>
        </div>

      </div>

    </div>


    <div id="mode-lishi" hidden>
      <label for="lishi">Lishi stamped on the tool</label>
      <input id="lishi" placeholder="Example: HU100R V3">
    </div>


    <div id="mode-keyway" hidden>
      <label for="keyway">Keyway or blank number</label>
      <input id="keyway" placeholder="Example: H75, HU101, Y157, TOY48">
    </div>


    <div id="mode-quick" hidden>
      <label for="quickSearch">Quick shop search</label>
      <input
        id="quickSearch"
        placeholder="Try: 2017 Range Rover Sport, HU101, H75, F-150"
      >
    </div>


    <div class="actions">
      <button class="btn" id="searchBtn">Search</button>
      <button class="btn secondary" id="clearBtn">Clear</button>
      <button class="btn secondary" id="recentBtn">Recent Searches</button>
    </div>


    <div id="result" class="result"></div>

  </div>


  <div class="quick-tools">

    <button data-tool="FO38">
      <strong>FO38</strong>
      <span class="tiny">Older Ford / H75</span>
    </button>

    <button data-tool="HU100R V3">

    </button>

    <button data-tool="NSN14 DR/BT">
      <strong>NSN14 DR/BT</strong>
      <span class="tiny">Nissan / Infiniti</span>
    </button>

  </div>

</div>

const recentSearches = [];

let currentMode = "ymm";


const yearSelect =
  document.getElementById("year");

const makeSelect =
  document.getElementById("make");

const modelSelect =
  document.getElementById("model");

const resultBox =
  document.getElementById("result");


document.getElementById("toolCount").textContent =
  lishiCatalog.length;


function loadYears() {

  let html = "";

  for (let year = 2026; year >= 1980; year--) {

    html += `<option value="${year}">
      ${year}
    </option>`;

  }

  yearSelect.innerHTML = html;

  yearSelect.value = "2024";

}


function loadMakes() {

  const year =
    Number(yearSelect.value);

  const makes =
    [...new Set(
      vehicleDatabase
        .filter(
          item =>
            year >= item.yearMin &&
            year <= item.yearMax
        )
        .map(
          item =>
            item.make
        )
    )]
    .sort();


  makeSelect.innerHTML =
    makes
      .map(
        make =>
          `<option value="${make}">
            ${make}
          </option>`
      )
      .join("");


  loadModels();

}


function loadModels() {

  const year =
    Number(yearSelect.value);

  const make =
    makeSelect.value;


  const models =
    [...new Set(
      vehicleDatabase
        .filter(
          item =>
            year >= item.yearMin &&
            year <= item.yearMax &&
            item.make === make
        )
        .flatMap(
          item =>
            item.models
        )
    )]
    .sort();


  modelSelect.innerHTML =
    models
      .map(
        model =>
          `<option value="${model}">
            ${model}
          </option>`
      )
      .join("");

}


function showResult(item) {

  resultBox.innerHTML = `

    <span class="badge">
      Recommended Lishi
    </span>

    <span class="badge">
      ${item.confidence}
    </span>

    <div class="tool">
      ${item.tool}
    </div>

    <div class="vehicle-line">
      ${item.vehicleFamily}
    </div>

    <p>
      ${item.examples}
    </p>

    <div class="facts">

      <div class="fact">
        <strong>
          Keyway / Blank
        </strong>

        ${item.keyway}
      </div>


      <div class="fact">
        <strong>
          Where Used
        </strong>

        ${item.used}
      </div>


      <div class="fact">
        <strong>
          Database Years
        </strong>

        ${item.yearMin}–${item.yearMax}
      </div>


      <div class="fact">
        <strong>
          Beginner Memory
        </strong>

        ${item.vehicleFamily.split(" — ")[0]}
        →
        ${item.tool}
      </div>

    </div>


    <div class="warning">

      <strong>
        Watch out:
      </strong>

      ${item.warning}

    </div>

  `;


  resultBox.classList.add("show");

}


function showMatches(matches) {

  if (matches.length === 0) {

    resultBox.innerHTML = `

      <div class="warning">

        <strong>
          No verified match found.
        </strong>

        <br><br>

        That does not mean no Lishi exists.

        Verify the exact keyway/application
        before inserting a tool.

      </div>

    `;

    resultBox.classList.add("show");

    return;

  }


  if (matches.length === 1) {

    showResult(matches[0]);

    return;

  }


  resultBox.innerHTML = `

    <div class="success">

      <strong>
        ${matches.length} possible matches found.
      </strong>

      <br>

      Select the correct application below.

    </div>


    <div class="matches">

      ${
        matches.map(

          (item,index) => `

            <div class="match">

              <strong>
                ${item.tool}
              </strong>

              <div>
                ${item.vehicleFamily}
              </div>

              <div class="tiny">
                Keyway:
                ${item.keyway}
              </div>

              <button
                class="btn secondary"
                data-result="${index}"
              >

                View details

              </button>

            </div>

          `

        ).join("")
      }

    </div>

  `;


  resultBox.classList.add("show");


  resultBox
    .querySelectorAll("[data-result]")
    .forEach(

      button => {

        button.addEventListener(

          "click",

          () => {

            const index =
              Number(
                button.dataset.result
              );

            showResult(
              matches[index]
            );

          }

        );

      }

    );

}


function searchYMM() {

  const year =
    Number(yearSelect.value);

  const make =
    makeSelect.value;

  const model =
    modelSelect.value;


  const matches =
    vehicleDatabase.filter(

      item =>

        year >= item.yearMin &&
        year <= item.yearMax &&
        item.make === make &&
        item.models.includes(model)

    );


  recentSearches.unshift(
    `${year} ${make} ${model}`
  );


  showMatches(matches);

}


function searchLishi() {

  const query =
    document
      .getElementById("lishi")
      .value
      .trim()
      .toLowerCase();


  if (!query) return;


  recentSearches.unshift(
    `Lishi: ${query}`
  );


  const tools =
    lishiCatalog.filter(

      tool =>
        tool.toLowerCase()
          .includes(query)

    );


  const vehicleMatches =
    vehicleDatabase.filter(

      item =>
        item.tool.toLowerCase()
          .includes(query)

    );


  if (vehicleMatches.length) {

    showMatches(vehicleMatches);

    return;

  }


  resultBox.innerHTML = `

    <div class="success">

      <strong>
        ${tools.length}
        catalog match${tools.length === 1 ? "" : "es"}
      </strong>

    </div>


    <div class="matches">

      ${
        tools.map(

          tool => `

            <div class="match">

              <strong>
                ${tool}
              </strong>

              <div class="tiny">

                Tool exists in the Lishi catalog.

                Exact YMM coverage still requires
                application verification.

              </div>

            </div>

          `

        ).join("")
      }

    </div>

  `;


  resultBox.classList.add("show");

}


function searchKeyway() {

  const query =
    document
      .getElementById("keyway")
      .value
      .trim()
      .toLowerCase();


  if (!query) return;


  recentSearches.unshift(
    `Keyway: ${query}`
  );


  const matches =
    vehicleDatabase.filter(

      item =>
        item.keyway
          .toLowerCase()
          .includes(query)

    );


  showMatches(matches);

}


function quickSearch() {

  const query =
    document
      .getElementById("quickSearch")
      .value
      .trim()
      .toLowerCase();


  if (!query) return;


  recentSearches.unshift(
    `Quick: ${query}`
  );


  const yearMatch =
    query.match(
      /\b(19|20)\d{2}\b/
    );


  const year =
    yearMatch
      ? Number(yearMatch[0])
      : null;


  const words =
    query
      .split(/\s+/)
      .filter(
        word =>
          !/^\d{4}$/.test(word)
      );


  const matches =
    vehicleDatabase.filter(

      item => {

        const text = [

          item.make,

          ...item.models,

          item.tool,

          item.keyway,

          item.vehicleFamily,

          item.examples

        ]
        .join(" ")
        .toLowerCase();


        const wordsMatch =
          words.every(
            word =>
              text.includes(word)
          );


        const yearMatches =
          !year ||
          (
            year >= item.yearMin &&
            year <= item.yearMax
          );


        return (
          wordsMatch &&
          yearMatches
        );

      }

    );


  showMatches(matches);

}


function search() {

  if (currentMode === "ymm") {

    searchYMM();

  }

  else if (currentMode === "lishi") {

    searchLishi();

  }

  else if (currentMode === "keyway") {

    searchKeyway();

  }

  else {

    quickSearch();

  }

}


document
  .querySelectorAll(".tab")
  .forEach(

    button => {

      button.addEventListener(

        "click",

        () => {

          currentMode =
            button.dataset.mode;


          document
            .querySelectorAll(".tab")
            .forEach(
              item =>
                item.classList.remove("active")
            );


          button.classList.add("active");


          [
            "ymm",
            "lishi",
            "keyway",
            "quick"
          ]
          .forEach(

            mode => {

              document
                .getElementById(
                  `mode-${mode}`
                )
                .hidden =
                  mode !== currentMode;

            }

          );


          resultBox.classList.remove("show");

        }

      );

    }

  );


yearSelect.addEventListener(
  "change",
  loadMakes
);


makeSelect.addEventListener(
  "change",
  loadModels
);


document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    search
  );


document
  .getElementById("clearBtn")
  .addEventListener(

    "click",

    () => {

      document
        .querySelectorAll("input")
        .forEach(
          input =>
            input.value = ""
        );


      resultBox.classList.remove("show");

    }

  );


document
  .getElementById("recentBtn")
  .addEventListener(

    "click",

    () => {

      const recent =
        recentSearches
          .slice(0,8);


      if (!recent.length) {

        resultBox.innerHTML = `

          <div class="warning">
            No recent searches yet.
          </div>

        `;

      }

      else {

        resultBox.innerHTML = `

          <div class="success">

            <strong>
              Recent Searches
            </strong>

          </div>


          <div class="matches">

            ${
              recent.map(

                item => `

                  <div class="match">
                    ${item}
                  </div>

                `

              ).join("")
            }

          </div>

        `;

      }


      resultBox.classList.add("show");

    }

  );


document
  .querySelectorAll("[data-tool]")
  .forEach(

    button => {

      button.addEventListener(

        "click",

        () => {

          const tool =
            button.dataset.tool;


          const match =
            vehicleDatabase.find(

              item =>
                item.tool === tool

            );


          if (match) {

            showResult(match);

          }

        }

      );

    }

  );


document
  .querySelectorAll(
    "#lishi, #keyway, #quickSearch"
  )
  .forEach(

    input => {

      input.addEventListener(

        "keydown",

        event => {

          if (event.key === "Enter") {

            search();

          }

        }

      );

    }

  );


loadYears();
loadMakes();

</script>
