name: Validate static app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
          if(!scripts.length) throw new Error('No script found');
          scripts.forEach((m,i)=>{try{new Function(m[1]);}catch(e){console.error('Inline script '+(i+1)+' syntax error');throw e;}});
          console.log('Validated '+scripts.length+' inline script(s)');
          NODE
